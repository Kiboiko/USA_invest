<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img"
     aria-label="Illustration of a financial dashboard with a chart and portfolio panels">
  <rect width="1200" height="675" fill="#f2f4f7"/>
  <rect x="60" y="60" width="1080" height="555" rx="18" fill="#ffffff" stroke="#e0e4ea" stroke-width="2"/>

  <!-- top bar -->
  <rect x="60" y="60" width="1080" height="56" rx="18" fill="#101f33"/>
  <rect x="60" y="98" width="1080" height="18" fill="#101f33"/>
  <circle cx="94" cy="88" r="7" fill="#3c5876"/>
  <circle cx="118" cy="88" r="7" fill="#3c5876"/>
  <circle cx="142" cy="88" r="7" fill="#3c5876"/>
  <rect x="520" y="79" width="220" height="18" rx="9" fill="#1a2c42"/>

  <!-- chart area -->
  <rect x="100" y="156" width="700" height="360" rx="12" fill="#f7f9fb" stroke="#e5e9ef"/>
  <g stroke="#e5e9ef" stroke-width="1">
    <line x1="130" y1="236" x2="770" y2="236"/>
    <line x1="130" y1="316" x2="770" y2="316"/>
    <line x1="130" y1="396" x2="770" y2="396"/>
    <line x1="130" y1="476" x2="770" y2="476"/>
  </g>
  <polyline points="140,458 200,420 260,436 320,382 380,398 440,340 500,352 560,300 620,268 680,286 740,224"
            fill="none" stroke="#1f8f33" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="140,458 200,420 260,436 320,382 380,398 440,340 500,352 560,300 620,268 680,286 740,224 740,500 140,500"
           fill="#1f8f33" opacity="0.08"/>

  <!-- bars -->
  <g fill="#c9d3de">
    <rect x="140" y="486" width="18" height="30" rx="3"/>
    <rect x="200" y="470" width="18" height="46" rx="3"/>
    <rect x="260" y="480" width="18" height="36" rx="3"/>
    <rect x="320" y="462" width="18" height="54" rx="3"/>
    <rect x="380" y="474" width="18" height="42" rx="3"/>
    <rect x="440" y="456" width="18" height="60" rx="3"/>
    <rect x="500" y="468" width="18" height="48" rx="3"/>
    <rect x="560" y="450" width="18" height="66" rx="3"/>
    <rect x="620" y="462" width="18" height="54" rx="3"/>
    <rect x="680" y="472" width="18" height="44" rx="3"/>
    <rect x="740" y="446" width="18" height="70" rx="3"/>
  </g>

  <!-- side cards -->
  <rect x="828" y="156" width="272" height="112" rx="12" fill="#f7f9fb" stroke="#e5e9ef"/>
  <rect x="852" y="182" width="120" height="14" rx="7" fill="#c9d3de"/>
  <rect x="852" y="212" width="180" height="26" rx="8" fill="#101f33"/>

  <rect x="828" y="288" width="272" height="112" rx="12" fill="#f7f9fb" stroke="#e5e9ef"/>
  <rect x="852" y="314" width="150" height="14" rx="7" fill="#c9d3de"/>
  <rect x="852" y="344" width="110" height="26" rx="8" fill="#1f8f33"/>

  <rect x="828" y="420" width="272" height="96" rx="12" fill="#f7f9fb" stroke="#e5e9ef"/>
  <rect x="852" y="446" width="200" height="12" rx="6" fill="#c9d3de"/>
  <rect x="852" y="470" width="160" height="12" rx="6" fill="#dde3ea"/>
  <rect x="852" y="492" width="120" height="12" rx="6" fill="#dde3ea"/>

  <!-- footer bar -->
  <rect x="100" y="544" width="1000" height="40" rx="10" fill="#f2f4f7"/>
  <rect x="124" y="558" width="180" height="12" rx="6" fill="#c9d3de"/>
  <rect x="330" y="558" width="120" height="12" rx="6" fill="#dde3ea"/>
  <rect x="476" y="558" width="150" height="12" rx="6" fill="#dde3ea"/>
